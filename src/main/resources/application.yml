spring:
  application:
    name: zero-logic-backend
  profiles:
    active: local
  session:
    store-type: redis
    timeout: 86400
    redis:
      namespace: zero-logic:session:v2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

attachment:
  temporary-ttl-hours: 24

generation:
  app-permit-lease-minutes: 30
  build:
    enabled: true
    install-timeout-seconds: 300
    build-timeout-seconds: 180
    max-log-chars: 60000
  repair:
    enabled: true
    max-attempts: 2
    timeout-seconds: 180
    max-build-log-chars: 12000

rag:
  enabled: true
  top-k: 5
  max-injected-chars: 6000
  chunk-size: 1000
  chunk-overlap: 120
  embedding:
    model-name: ${EMBEDDING_MODEL_NAME:text-embedding-v4}
    dimension: ${EMBEDDING_DIMENSION:1024}

server:
  port: 8123
  servlet:
    context-path: /api  # 访问时注意这个，或者在部署后端后，启动时使用 --server.servlet.context-path=/ 去除 api
    session:
      cookie:
        max-age: 86400

knife4j:
  enable: true
  setting:
    language: zh_cn
